<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Вхід до системи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h2>Контекстна автентифікація Zero Trust</h2>

    {% if not session.get('user') %}
    <form method="POST">
        <label>Ім'я користувача:</label><br>
        <input type="text" name="username" placeholder="Username" required><br><br>

        <label>Пароль:</label><br>
        <input type="password" name="password" placeholder="Password" required><br><br>

        <label>Тип пристрою (Device Context):</label><br>
        <select name="device">
            <option value="managed">Managed (Шкільний/Керований)</option>
            <option value="unmanaged">Unmanaged (Власний/BYOD)</option>
        </select><br><br>

        <label>Поточна мережа (Network Context):</label><br>
        <select name="network">
            <option value="school">School (Внутрішня шкільна)</option>
            <option value="home">Home (Домашня мережа)</option>
            <option value="public">Public (Публічний Wi-Fi / Кафе)</option>
        </select><br><br>

        <button type="submit">Увійти</button>
    </form>
    {% else %}
    <p>Ви вже авторизовані як <strong>{{ session['user'] }}</strong>.</p>
    <a href="/dashboard">Перейти до Панелі керування</a> | <a href="/logout">Вийти</a>
    {% endif %}
</body>

</html>
